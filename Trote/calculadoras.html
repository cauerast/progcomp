<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trote solidario - 2025</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header> Trote Solidário - 2025 </header>
    <nav>
        <div id="links">
            <a href="index.html">Home</a>
            <a href="introdução.html">Introdução</a>
            <a href="objetivo.html">Objetivo</a>
            <a href="formato.html">Formato</a>
            <a href="gincana.html">Gincana</a>
            <a href="integração.html">Integração</a>
            <a href="observações.html">Observações</a>
            <a href="calculadoras.html">Calculadoras</a>
        </div>
        <img src="images/trotesolidario2025.jpg" alt="trotesolidario2025">
    </nav>
    <div class="container">


        <h2> Calculadoras de pontuação </h2>
        <div class="forms">
            <form>
                <div class="campos">
                    <label>Selecione a cor da equipe</label>
                    <select id="equipe">
                        <option value="Laranja">Laranja</option>
                        <option value="Preta">Preta</option>
                        <option value="Roxa">Roxa</option>
                        <option value="Verde">Verde</option>
                        <option value="Vermelha">Vermelha</option>
                    </select>
                </div>
                <div class="campos">
                    <label>Ação Social (pts)</label>
                    <input type="number" id="acaoSocial">
                </div>
                <div class="campos">
                    <label>Homenagem (pts)</label>
                    <input type="number" id="homenagem">
                </div>
                <div class="campos">
                    <label>Caixas de leite (L) </label>
                    <input type="number" id="leite">
                </div>
                <div class="campos">
                    <label>Kit alimentação </label>
                    <input type="number" id="kitAlimentacao">
                </div>
                <div class="campos">
                    <label>Lata de suplemento </label>
                    <input type="number" id="suplemento">
                </div>
                <div class="campos">
                    <label>Pacote de Arroz (kg)</label>
                    <input type="number" id="arroz">
                </div>
                <div class="campos">
                    <label>Pacote de feijão (kg)</label>
                    <input type="number" id="feijao">
                </div>
                <div class="campos">
                    <label>Pacote de Macarrão de (400/500g)</label>
                    <input type="number" id="macarrao">
                </div>
                <div class="campos">
                    <label>Óleo (900ml)</label>
                    <input type="number" id="oleo">
                </div>
                <div class="campos">
                    <label>Doação de Sangue</label>
                    <input type="number" id="doacaoSangue">
                </div>

            
                <div class="campos">
                    <button type="button" onclick="calcular()">Calcular</button>
                    <label id="soma"></label>
                </div>
            </form>
        </div>


    </div>
</body>
<script src="/scripts/scripts.js"></script>
</html>
