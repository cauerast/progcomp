<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Consumo de API</title>
</head>
<body>
    <h1>Recent Posts!</h1>
    <br>
    <input type="number" name="nPosts" id="input" min="1" max="100">
    <button onclick="showPosts()">Show posts</button>
    <div id="postList"></div>
    <script>
    async function showPosts(){
        try{
            const input = document.getElementById("input").value
            const response = await fetch(`https://jsonplaceholder.typicode.com/posts?_limit=${input}`);
            const posts = await response.json();
            const div = document.getElementById("postList");
            div.innerHTML = "";

            for (let i = 0; i < posts.length; i++) {
                const h2 = document.createElement("h2");
                h2.textContent = `${posts[i].title}`;
                div.appendChild(h2);
                
                const p = document.createElement("p");
                p.textContent = `${posts[i].body}`;
                div.appendChild(p);
            }
            
            
        } catch(error){
            console.error("erro ao carregar api", error)
        }
    }
  </script>
</body>
</html>
