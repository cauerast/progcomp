<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Consumo de API</title>
</head>
<body>
    <h1>Lista de Usuários</h1>
    <button onclick="carregarUsuarios()">Consultar enderecos</button>
    <ul id="listaUsuarios"></ul>
    <script>
    async function carregarUsuarios(){
        try{
            const resposta = await fetch("https://jsonplaceholder.typicode.com/users");
            const usuarios = await resposta.json();
            const lista = document.getElementById("listaUsuarios");
            lista.innerHTML = ""; // limpa lista

            for (let i = 0; i < usuarios.length; i++) {
                const name = document.createElement("li");
                name.textContent = `${usuarios[i].name}`;
                lista.appendChild(name);

                const address = document.createElement("li");
                address.textContent = `${usuarios[i].address.street}, ${usuarios[i].address.suite}, ${usuarios[i].address.city}, ${usuarios[i].address.zipcode}`;
                lista.appendChild(address)
            }
        } catch(error){
            console.error("Erro ao carregar usuários:", error);
            alert("Não foi possível carregar os dados da API.");
        }
    }
  </script>
</body>
</html>
