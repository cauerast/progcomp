<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Consumo de API</title>
</head>
<body>
    <h1>Photos!</h1>
    <br>
    <h2>Type the number of photos: </h2>
    <input type="number" id="input">
    <button onclick="showPhotos()">Show photos</button>
    <div id="photoList"></div>
    <script>
    async function showPhotos(){
        try{
            const input = document.getElementById("input").value
            const response = await fetch(`https://jsonplaceholder.typicode.com/photos?_limit=${input}`);
            const photos = await response.json();
            const div = document.getElementById("photoList");
    

            for (let i = 0; i < photos.length; i++) {
                const h2 = document.createElement("h2");
                h2.textContent = `${photos[i].title}`;
                div.appendChild(h2);

                const img = document.createElement("img");
                img.src = `${photos[i].url}`;
                img.alt = "img";
                div.appendChild(img);
            }
        } catch(error){
            console.error("erro ao carregar api", error)
        }
    }
  </script>
</body>
</html>
